[package]
name = "athena"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
# Already in the tree under the clipboard plugin. Named here for the PRIMARY selection,
# which the plugin does not expose. See src/clipboard.rs.
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"

[profile.release]
strip = true
lto = true
