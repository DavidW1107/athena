<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Athena</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <span class="wordmark">ATHENA</span>
      <span id="counts" class="counts"></span>
      <span class="spacer"></span>
      <span id="mount-limits" class="mount"></span>
      <span id="mount-cost" class="mount"></span>
      <span id="mount-autopause" class="mount"></span>
      <span id="pressure" class="pressure" title="pbuild ls"></span>
      <button id="resume-all" class="ghost" title="pbuild resume-all">resume all</button>
      <button id="open-sessions" class="ghost" title="resume a past Claude session">resume</button>
      <button id="open-codex" class="ghost" title="codex-task runs">codex</button>
      <button id="open-report" class="ghost" title="what was done, in progress, stalled">report</button>
      <button id="open-handoff" class="ghost" title="move context between instances">handoff</button>
      <button id="adopt" class="ghost"
        title="adopt a tmux session or a process Athena did not start">adopt</button>
      <button id="new" class="primary">+ instance</button>
    </header>

    <div id="attention" class="attention" hidden></div>
    <div id="mount-broadcast" class="mount"></div>

    <main id="grid-host" class="grid-host"></main>

    <dialog id="adopter"></dialog>

    <dialog id="panel-sessions" class="panel">
      <h2 class="panel-title">Resume a session</h2>
      <div id="mount-sessions" class="panel-body"></div>
      <menu class="panel-menu"><button class="ghost" data-close>close</button></menu>
    </dialog>

    <dialog id="panel-codex" class="panel">
      <h2 class="panel-title">Codex runs</h2>
      <div id="mount-codex" class="panel-body"></div>
      <menu class="panel-menu"><button class="ghost" data-close>close</button></menu>
    </dialog>

    <dialog id="panel-handoff" class="panel">
      <h2 class="panel-title">Hand off context</h2>
      <div id="mount-handoff" class="panel-body"></div>
      <menu class="panel-menu"><button class="ghost" data-close>close</button></menu>
    </dialog>

    <dialog id="panel-report" class="panel panel-wide">
      <h2 class="panel-title">Work report</h2>
      <div id="mount-report" class="panel-body"></div>
      <menu class="panel-menu"><button class="ghost" data-close>close</button></menu>
    </dialog>

    <dialog id="launcher">
      <form method="dialog">
        <label>Machine
          <select id="l-host"></select>
        </label>
        <label>Directory
          <input id="l-cwd" list="repos" autocomplete="off" spellcheck="false" />
        </label>
        <datalist id="repos"></datalist>
        <label>Command
          <select id="l-cmd">
            <option value="claude">claude</option>
            <option value="claude --continue">claude --continue</option>
            <option value="codex">codex</option>
            <option value="bash">bash</option>
          </select>
        </label>
        <label>Name (optional)
          <input id="l-name" autocomplete="off" />
        </label>
        <menu>
          <button value="cancel" class="ghost">cancel</button>
          <button id="l-go" value="go" class="primary">launch</button>
        </menu>
      </form>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
